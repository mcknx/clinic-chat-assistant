<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Front desk — Bayview Dental</title>
<style>
  :root { --ink:#0f2a3d; --muted:#5b7083; --line:#dde5ec; --brand:#0e7c86; --bg:#f3f7fa; --ok:#1a7f4b; --warn:#b54708; --new:#2563eb; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { background:#fff; border-bottom:1px solid var(--line); padding:12px 24px; display:flex; align-items:center; gap:10px; }
  .logo { width:32px; height:32px; border-radius:9px; background:var(--brand); color:#fff; display:grid; place-items:center; font-weight:700; }
  h1 { margin:0; font-size:17px; } h1 small { color:var(--muted); font-weight:400; font-size:14px; }
  .meta { margin-left:auto; color:var(--muted); font-size:13px; display:flex; align-items:center; gap:6px; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--ok); animation:pulse 2s infinite; }
  @keyframes pulse { 50% { opacity:.3; } }
  main { display:grid; grid-template-columns:repeat(3, 1fr); gap:16px; padding:20px 24px; max-width:1280px; margin:0 auto; }
  .col h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); display:flex; align-items:center; gap:8px; }
  .col h2 i { width:10px; height:10px; border-radius:3px; }
  .col h2 span { margin-left:auto; background:#fff; border:1px solid var(--line); border-radius:999px; padding:0 9px; font-size:12px; color:var(--ink); letter-spacing:0; }
  .open h2 i { background:var(--new); } .booked h2 i { background:var(--ok); } .handoff h2 i { background:var(--warn); }
  .card { background:#fff; border:1px solid var(--line); border-left:4px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:10px; box-shadow:0 1px 2px rgba(15,42,61,.04); }
  .open .card { border-left-color:var(--new); } .booked .card { border-left-color:var(--ok); } .handoff .card { border-left-color:var(--warn); }
  .card.newest { box-shadow:0 0 0 3px rgba(14,124,134,.25), 0 8px 20px rgba(15,42,61,.1); animation:flash 1.2s ease-out; }
  @keyframes flash { from { background:#e3f2f3; } }
  .top { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .top b { font-size:15px; } .top time { margin-left:auto; color:var(--muted); font-size:12px; }
  .tag { font-size:11px; font-weight:700; color:#fff; background:var(--brand); border-radius:4px; padding:1px 6px; }
  dl { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:0; font-size:13px; }
  dt { color:var(--muted); } dd { margin:0; } dd::first-letter { text-transform:uppercase; }
  .slot { margin-top:8px; font-weight:600; color:var(--ok); }
  .last { margin-top:8px; padding:8px 10px; background:#fff4e5; border-radius:6px; font-size:13px; color:#5c3a0e; }
  .empty { color:var(--muted); border:1px dashed var(--line); border-radius:10px; padding:20px; text-align:center; }
  @media (max-width:820px) { main { grid-template-columns:1fr; padding:16px; } header { padding:12px 16px; } h1 small { display:none; } }
</style>
</head>
<body>
<header><div class="logo">B</div><h1>Front desk <small>· chat assistant inbox</small></h1><div class="meta"><span class="dot"></span><span id="st">Live · refreshes every 3 s</span></div></header>
<main>
  <section class="col open"><h2><i></i>New leads<span id="n-open">0</span></h2><div id="c-open"></div></section>
  <section class="col booked"><h2><i></i>Booked<span id="n-booked">0</span></h2><div id="c-booked"></div></section>
  <section class="col handoff"><h2><i></i>Needs a human<span id="n-handoff">0</span></h2><div id="c-handoff"></div></section>
</main>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago = t => { const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? "just now" : s < 3600 ? Math.floor(s / 60) + " min ago" : new Date(t).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" }); };
const slot = iso => new Date(iso).toLocaleString("en-US", { timeZone:"Asia/Manila", weekday:"short", month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
const empty = { open:"No open conversations.", booked:"No bookings yet.", handoff:"Nothing waiting on a human." };

let prev = "";
async function load() {
  try {
    const raw = await (await fetch("/p2/state")).text();
    $("st").textContent = "Live · refreshes every 3 s";
    if (raw === prev) return; // only re-render on change, so the newest-card flash plays once
    prev = raw;
    const { leads, bookings, messages } = JSON.parse(raw);
    const lastUser = {}; for (const m of messages) if (m.role === "user") lastUser[m.session] = m.content;
    const when = {}; for (const b of bookings) when[b.booked_by] = b.starts_at;
    const html = { open:"", booked:"", handoff:"" }, n = { open:0, booked:0, handoff:0 };
    leads.forEach((l, i) => {
      n[l.status]++;
      const f = [["Service", l.service], ["Patient", l.patient_type], ["Preferred", l.preferred_day]].filter(x => x[1]);
      html[l.status] += `<div class="card${i ? "" : " newest"}">
        <div class="top"><b>${esc(l.name || "Visitor")}</b>${i ? "" : '<span class="tag">NEW</span>'}<time>${ago(l.updated_at)}</time></div>
        ${f.length ? `<dl>${f.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>` : ""}
        ${l.status === "booked" && when[l.session] ? `<div class="slot">✓ ${slot(when[l.session])}</div>` : ""}
        ${l.status === "handoff" && lastUser[l.session] ? `<div class="last">“${esc(lastUser[l.session])}”</div>` : ""}
      </div>`;
    });
    for (const k in html) { $("c-" + k).innerHTML = html[k] || `<div class="empty">${empty[k]}</div>`; $("n-" + k).textContent = n[k]; }
  } catch { $("st").textContent = "Offline · retrying…"; }
}
load(); setInterval(load, 3000);
</script>
</body>
</html>
